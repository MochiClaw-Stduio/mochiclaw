[workspace]
resolver = "2"
members = [
    "sdk",
    "sdk-macro",
    "config",
    "lambda",
    "core",
    "cli",
    "lambdas/weixin",
    "lambdas/openai",
    "lambdas/fs",
    "lambda-tests/test-kv",
    "lambda-tests/test-random",
    "lambda-tests/test-fs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mochiclaw Team"]
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
toml = "0.8"
rand = "0.8"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
glob = "0.3"
rmp-serde = "1"
extism-pdk = "1"
extism-convert = { version = "1", features = ["msgpack"] }
tempfile = "3"
base64 = "0.22"
proc-macro2 = "1"
quote = "1"
syn = "2"
