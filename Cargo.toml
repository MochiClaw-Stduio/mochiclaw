[workspace]
resolver = "2"
members = [
    "mochiclaw-sdk",
    "mochiclaw-plugin",
    "mochiclaw-core",
    "mochiclaw-cli",
    "plugins/mochiclaw-weixin",
    "plugins/mochiclaw-openai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mochiclaw Team"]
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toml = "0.8"
rand = "0.8"
time = { version = "0.3", features = ["formatting"] }
