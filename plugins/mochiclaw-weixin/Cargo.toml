[package]
name = "mochiclaw-weixin"
version.workspace = true
edition.workspace = true
description = "Weixin channel plugin for Mochiclaw"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
extism-manifest = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rmp-serde = "1"
mochiclaw-sdk = { path = "../../mochiclaw-sdk" }
base64 = "0.22"
hex = "0.4"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
generic-array = "0.14"
md-5 = "0.10"
