[package]
name = "mochiclaw-fs"
version.workspace = true
edition.workspace = true
description = "Filesystem tool plugin for Mochiclaw"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
mochiclaw-sdk = { path = "../../mochiclaw-sdk" }
