[package]
name = "mochiclaw-lambda"
version.workspace = true
edition.workspace = true
description = "Mochiclaw Lambda - Lambda host, manifest, and registry"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
toml.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
url.workspace = true
glob.workspace = true
extism = { version = "1", default-features = false, features = ["register-filesystem", "wasmtime-default-features"] }
extism-convert.workspace = true
mochiclaw-sdk = { path = "../sdk" }
mochiclaw-config = { path = "../config" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile.workspace = true
